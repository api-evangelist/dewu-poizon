name: Dewu (POIZON)
description: >-
  Dewu (POIZON) is a leading Chinese online marketplace for sneakers, streetwear, luxury goods, and
  collectibles, distinguished by its integrated product authentication (legit-check) service that
  verifies items before they ship to buyers. Operated by Shanghai-based Poizon and backed by Hongshan
  (formerly Sequoia China), it runs both the domestic Dewu (得物) app and the global POIZON marketplace.
  For developers it operates the POIZON / Dewu Open Platform (open.poizon.com and open.dewu.com), a
  partner program that lets sellers, ISVs, and ERP integrators connect to the marketplace over an
  app-key plus request-signature authenticated API covering product data, pricing, catalog search,
  delivery modes, and vendor information.
